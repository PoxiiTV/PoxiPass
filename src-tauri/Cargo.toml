[package]
name = "poxipass"
version = "0.3.1"
description = "PoxiPass - gestor y generador de contraseñas"
edition = "2021"
rust-version = "1.85"

[lib]
name = "poxipass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde_bytes = "0.11"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
zxcvbn = "3"
totp-rs = { version = "5", features = ["otpauth"] }
rqrr = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "bmp", "webp"] }
csv = "1"
psl = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time", "rt", "net", "io-util", "io-std", "sync", "macros"] }
keepass = "0.15"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Security_Cryptography",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
] }
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Credentials_UI",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Argon2 de los .kdbx: sin optimizar tarda decenas de segundos en desarrollo
[profile.dev.package.rust-argon2]
opt-level = 3

[dev-dependencies]
keepass = { version = "0.15", features = ["save_kdbx4"] }
